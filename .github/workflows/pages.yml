# Publishes the web version on GitHub Pages (also for the iPhone).
# Every push to main that touches the web files updates it.
# A syntax check runs first; a broken script stops the publishing.
# Only the web files go out - no README, no build plans.
# The Android app is built separately by apk.yml.
name: Web-Version veroeffentlichen

on:
  push:
    branches: [main]
    paths:
      - index.html
      - sw.js
      - manifest.webmanifest
      - "icon-*.png"
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Check the syntax of the script and the service worker
        run: |
          sed -n '/^<script>/,/^<\/script>/p' index.html | sed '1d;$d' > app.js
          node --check app.js
          node --check sw.js
      - name: Assemble web files
        run: |
          mkdir site
          cp index.html sw.js manifest.webmanifest icon-32.png icon-180.png icon-192.png icon-512.png site/
          ls -la site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
