name: Android-App bauen

# A release comes from a version number, never from an arbitrary state. Two
# ways lead there:
#
#   A) In the browser: "Actions" tab -> "Android-App bauen" -> "Run workflow",
#      tick "veroeffentlichen". The tag is created in the process.
#   B) On the command line: git tag v1.2.3 && git push origin v1.2.3
#
# Either way the build plan first checks that package.json, the footer of
# index.html and CHANGELOG.md name the same number, then builds the APK with
# exactly that number and creates the release v1.2.3. That stays unchanged
# afterwards - every new version gets its own.
#
# "Run workflow" without the tick only builds for trying things out.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      veroeffentlichen:
        description: 'Veroeffentlichen (Marke anlegen und Release erstellen)'
        type: boolean
        default: false

permissions:
  contents: write

env:
  # The fingerprint of the signing key. Not a secret - it is in every
  # published APK and is there precisely to be checked publicly. If a build
  # differs from it, it was signed with a different key and the app could no
  # longer be updated: then the build aborts before anything is published.
  ERWARTETE_SIGNATUR: "82:B8:A1:99:A0:D6:A3:0B:B8:2E:9B:87:E0:A2:C8:75:31:F6:66:0F:9B:8F:67:3C:D1:4C:C9:80:ED:97:9C:A9"

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch source
        uses: actions/checkout@v7

      - name: Determine version and compare locations
        # Three places name the version. If they differ, the build aborts -
        # better here than in the user's hands.
        id: fassung
        run: |
          set -eu
          PAKET="$(node -p "require('./package.json').version")"
          RAUS=nein

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            RAUS=ja
            if [ "${GITHUB_REF_NAME#v}" != "$PAKET" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match package.json ($PAKET)."
              exit 1
            fi
          elif [ "${{ inputs.veroeffentlichen }}" = "true" ]; then
            RAUS=ja
            if git ls-remote --exit-code --tags origin "refs/tags/v$PAKET" >/dev/null 2>&1; then
              echo "::error::The tag v$PAKET already exists. Raise the version first."
              exit 1
            fi
          fi

          if [ "$RAUS" = "ja" ]; then
            FEHLER=0
            if ! grep -q "data-fassung=\"$PAKET\"" index.html; then
              echo "::error::The footer of index.html does not name version $PAKET."
              echo "::error::Expected is <p class=\"fassung\" id=\"fassung\" data-fassung=\"$PAKET\">."
              FEHLER=1
            fi
            if ! grep -q "^## \[$PAKET\]" CHANGELOG.md; then
              echo "::error::CHANGELOG.md has no section [$PAKET]."
              FEHLER=1
            fi
            [ "$FEHLER" -eq 0 ] || exit 1
          fi
          echo "raus=$RAUS" >> "$GITHUB_OUTPUT"

          # Android counts versions as a whole number that must never get
          # smaller. 1.2.3 becomes 10203.
          MA="$(echo "$PAKET" | cut -d. -f1)"
          MI="$(echo "$PAKET" | cut -d. -f2)"
          PA="$(echo "$PAKET" | cut -d. -f3)"
          echo "nummer=$PAKET"                        >> "$GITHUB_OUTPUT"
          echo "code=$((MA * 10000 + MI * 100 + PA))" >> "$GITHUB_OUTPUT"
          echo "Version $PAKET, Android counter $((MA * 10000 + MI * 100 + PA))"

      - name: Provide signing key
        # Without a fixed key Gradle signs every build with a new random key.
        # For Android the signature is the app's identity: two packages with
        # different identities are two different apps, and an update fails
        # with "App not installed".
        env:
          SCHLUESSEL: ${{ secrets.SIGNIER_SCHLUESSEL }}
          PASSWORT: ${{ secrets.SIGNIER_PASSWORT }}
        run: |
          set -eu
          if [ -z "${SCHLUESSEL:-}" ] || [ -z "${PASSWORT:-}" ]; then
            echo "::error::The secrets SIGNIER_SCHLUESSEL and SIGNIER_PASSWORT are missing."
            echo "::error::To be created under Settings -> Secrets and variables -> Actions."
            echo "::error::More in DEVELOPMENT.md, section \"Signing\"."
            exit 1
          fi
          printf '%s' "$SCHLUESSEL" | base64 -d > "$RUNNER_TEMP/spieleabend.keystore"
          test -s "$RUNNER_TEMP/spieleabend.keystore"
          echo "Key ready ($(wc -c < "$RUNNER_TEMP/spieleabend.keystore") bytes)."

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Collect web files
        # Capacitor expects the page in a folder of its own. The server and
        # the Windows scripts do not belong in the app.
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest www/
          cp icon-32.png icon-180.png icon-192.png icon-512.png www/
          ls -la www

      - name: Prepare the app icon
        # icon-only is the icon for surfaces without adaptive display: the
        # finished round disc. For adaptive icons we supply two layers -
        # app-icon-background carries the two-part split, app-icon-foreground
        # the motif.
        run: |
          mkdir -p assets
          cp icon-512.png assets/icon-only.png
          cp app-icon-foreground.png assets/icon-foreground.png
          cp app-icon-background.png assets/icon-background.png

      - name: Install dependencies
        run: npm install

      - name: Generate Android project
        run: npx cap add android

      - name: Insert the system colours component
        # From version 12 on, Android derives a palette from the wallpaper and
        # only makes it available to native apps. This component reads it out
        # and passes it on to the page, where the app's colours are made from
        # it. It has to go in again with every build, because "cap add
        # android" creates the project afresh each time - the same pattern as
        # with the signature further down.
        run: |
          set -eu
          ORDNER=android/app/src/main/java/de/drnerdlove/spieleabend
          test -d "$ORDNER"
          cat > "$ORDNER/SystemfarbenPlugin.java" <<'JAVA'
          package de.drnerdlove.spieleabend;

          import android.os.Build;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "Systemfarben")
          public class SystemfarbenPlugin extends Plugin {

              private static final String[] PALETTEN = { "accent1", "accent2", "accent3", "neutral1", "neutral2" };
              private static final int[] STUFEN = { 0, 10, 50, 100, 200, 300, 400, 500, 600, 700, 800, 900, 1000 };

              @PluginMethod
              public void lesen(PluginCall call) {
                  JSObject antwort = new JSObject();
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.S) {
                      antwort.put("verfuegbar", false);
                      call.resolve(antwort);
                      return;
                  }
                  JSObject farben = new JSObject();
                  boolean gefunden = false;
                  for (String palette : PALETTEN) {
                      JSObject stufen = new JSObject();
                      for (int stufe : STUFEN) {
                          String name = "system_" + palette + "_" + stufe;
                          // By name instead of via android.R.color.*: that way it
                          // simply drops out on older devices instead of failing.
                          int kennung = getContext().getResources().getIdentifier(name, "color", "android");
                          if (kennung == 0) continue;
                          int wert = getContext().getResources().getColor(kennung, getContext().getTheme());
                          stufen.put(String.valueOf(stufe), String.format("#%06X", 0xFFFFFF & wert));
                          gefunden = true;
                      }
                      farben.put(palette, stufen);
                  }
                  antwort.put("verfuegbar", gefunden);
                  antwort.put("farben", farben);
                  call.resolve(antwort);
              }
          }
          JAVA
          cat > "$ORDNER/SprachePlugin.java" <<'JAVA'
          package de.drnerdlove.spieleabend;

          import android.content.res.Configuration;
          import android.os.Build;
          import java.util.Locale;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          // From version 13 on, Android lets the language of individual apps
          // be set. The WebView does not notice: navigator.language keeps
          // naming the system language there, and that is by design. This
          // component reads the language of the Activity - which follows the
          // setting - and passes it on to the page.
          @CapacitorPlugin(name = "Sprache")
          public class SprachePlugin extends Plugin {

              static Locale jetzigeSprache(android.content.Context ctx) {
                  Configuration conf = ctx.getResources().getConfiguration();
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.N) {
                      android.os.LocaleList liste = conf.getLocales();
                      if (!liste.isEmpty()) return liste.get(0);
                  }
                  return Locale.getDefault();
              }

              @PluginMethod
              public void lesen(PluginCall call) {
                  // The Activity, not the application context: only its
                  // settings carry the app language.
                  android.content.Context ctx = getActivity() != null ? getActivity() : getContext();
                  Locale ort = jetzigeSprache(ctx);
                  JSObject antwort = new JSObject();
                  antwort.put("sprache", ort.getLanguage());
                  antwort.put("voll", ort.toString());
                  call.resolve(antwort);
              }
          }
          JAVA
          cat > "$ORDNER/MainActivity.java" <<'JAVA'
          package de.drnerdlove.spieleabend;

          import android.content.res.Configuration;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              private String letzteSprache;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  // Must come before super.onCreate: the bridge is built there,
                  // components registered afterwards come too late.
                  registerPlugin(SystemfarbenPlugin.class);
                  registerPlugin(SprachePlugin.class);
                  super.onCreate(savedInstanceState);
                  letzteSprache = SprachePlugin.jetzigeSprache(this).getLanguage();
              }

              // The manifest lists "locale" under configChanges - so Android does
              // not rebuild the Activity on a language change, and the page would
              // stay in the old language until someone closes the app. Hence we
              // check ourselves here and reload the page. The collection is in
              // the page's storage, nothing is lost in the process.
              @Override
              public void onConfigurationChanged(Configuration newConfig) {
                  super.onConfigurationChanged(newConfig);
                  String jetzt = SprachePlugin.jetzigeSprache(this).getLanguage();
                  if (letzteSprache != null && !letzteSprache.equals(jetzt)) {
                      letzteSprache = jetzt;
                      if (getBridge() != null && getBridge().getWebView() != null) {
                          getBridge().getWebView().reload();
                      }
                  }
              }
          }
          JAVA
          ls -la "$ORDNER"

      - name: Store the German name for the app menu
        # The name under the icon follows the same rule as the page: on a
        # German device "Spieleabend", otherwise the English name from
        # capacitor.config.json. Android picks it by the folder name -
        # values-de applies to German-speaking devices, values to all others.
        # Without this step only the English one would appear everywhere.
        run: |
          set -eu
          ZIEL=android/app/src/main/res/values-de
          mkdir -p "$ZIEL"
          cat > "$ZIEL/strings.xml" <<'XML'
          <?xml version='1.0' encoding='utf-8'?>
          <resources>
              <string name="app_name">Spieleabend</string>
              <string name="title_activity_main">Spieleabend</string>
          </resources>
          XML
          echo "German name stored:"
          cat "$ZIEL/strings.xml"

      - name: Register the app's languages with Android
        # From Android 13 on, Settings -> Apps -> Spieleabend has a
        # "Language" entry - but only if the app says which languages it
        # supports. That is exactly what locales_config.xml is; without the
        # reference in the manifest the entry does not even appear.
        run: |
          set -eu
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/locales_config.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <locale-config xmlns:android="http://schemas.android.com/apk/res/android">
              <locale android:name="en" />
              <locale android:name="de" />
          </locale-config>
          XML
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q 'android:localeConfig' "$MANIFEST" ||
            sed -i 's|<application$|<application\n        android:localeConfig="@xml/locales_config"|' "$MANIFEST"
          grep -q 'android:localeConfig' "$MANIFEST" || {
            echo "::error::localeConfig could not be added to the manifest."
            exit 1
          }
          echo "Language list registered:"
          sed -n '1,8p' "$MANIFEST"

      - name: Write the version into the Android project
        run: |
          set -eu
          sed -i 's/versionCode .*/versionCode ${{ steps.fassung.outputs.code }}/' android/app/build.gradle
          sed -i 's/versionName .*/versionName "${{ steps.fassung.outputs.nummer }}"/' android/app/build.gradle
          grep -n 'version\(Code\|Name\)' android/app/build.gradle

      - name: Add the signature to the Android project
        # A second android block supplements the one from the template; that
        # is more stable than cutting into the existing one.
        run: |
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  freigabe {
                      storeFile file(System.getenv("SPIELEABEND_KEYSTORE"))
                      storePassword System.getenv("SPIELEABEND_PASSWORT")
                      keyAlias "spieleabend"
                      keyPassword System.getenv("SPIELEABEND_PASSWORT")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.freigabe
                  }
              }
          }
          GRADLE
          tail -18 android/app/build.gradle

      - name: Generate icons
        # If this fails, the app is still built - just with the default icon.
        continue-on-error: true
        run: npx capacitor-assets generate --android

      - name: Copy web files into the project
        run: npx cap sync android

      - name: Build APK
        env:
          SPIELEABEND_KEYSTORE: ${{ runner.temp }}/spieleabend.keystore
          SPIELEABEND_PASSWORT: ${{ secrets.SIGNIER_PASSWORT }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Name the APK and check the signature
        id: apk
        # pipefail is essential here: without it only the exit status of the
        # last link of a pipeline counts. A failed keytool thus went unnoticed,
        # because the following sed was content with empty input.
        run: |
          set -euo pipefail
          NAME="game-night-${{ steps.fassung.outputs.nummer }}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          ls -la "$NAME"

          # apksigner instead of keytool: the latter only reads the old JAR
          # signature (v1), which is no longer produced at all from minSdk 24.
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          APKSIGNER="$(ls -d "$SDK"/build-tools/*/apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"

          "$APKSIGNER" verify --verbose "$NAME"
          ROH="$("$APKSIGNER" verify --print-certs "$NAME" | grep -m1 'SHA-256 digest' | sed 's/.*digest: *//')"
          test -n "$ROH"
          ABDRUCK="$(printf '%s' "$ROH" | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')"
          echo "Signature fingerprint: $ABDRUCK"

          if [ "$ABDRUCK" != "$ERWARTETE_SIGNATUR" ]; then
            echo "::error::Signed with a different key than expected."
            echo "::error::expected: $ERWARTETE_SIGNATUR"
            echo "::error::received: $ABDRUCK"
            echo "::error::Signed like this, the app could not be updated."
            exit 1
          fi
          echo "abdruck=$ABDRUCK" >> "$GITHUB_OUTPUT"

      - name: Attach the APK as a build artifact
        # Only for trial runs. In a release the same file is attached to the
        # release anyway and stays there permanently - the attachment would be
        # a second copy, which this project clears away after seven days
        # (checked on the attachment of a trial run: created 21 Oct, expires
        # 28 Oct). In a trial run it is the only way to get at the built file,
        # so it stays there.
        if: steps.fassung.outputs.raus != 'ja'
        uses: actions/upload-artifact@v7
        with:
          name: game-night-apk
          path: ${{ steps.apk.outputs.name }}

      - name: Get the release text from the changelog
        if: steps.fassung.outputs.raus == 'ja'
        run: |
          set -eu
          {
            echo "**Install:** Open the file \`${{ steps.apk.outputs.name }}\` on the"
            echo "phone. The first time, Android asks whether apps from this source"
            echo "are allowed - this has to be confirmed once. An existing version"
            echo "is replaced, the collection stays."
            echo
            echo "Signature: \`${{ steps.apk.outputs.abdruck }}\`"
            echo
            echo "---"
            echo
            awk -v v="${{ steps.fassung.outputs.nummer }}" '
              $0 ~ "^## \\[" v "\\]" { an = 1; next }
              an && /^## \[/          { exit }
              an && /^\[[^]]+\]: /    { exit }
              an                      { print }
            ' CHANGELOG.md
          } > begleittext.md
          cat begleittext.md

      - name: Publish
        # If the tag does not exist yet, GitHub creates it at this state when
        # the release is created.
        if: steps.fassung.outputs.raus == 'ja'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.fassung.outputs.nummer }}
          target_commitish: ${{ github.sha }}
          name: Game Night v${{ steps.fassung.outputs.nummer }}
          body_path: begleittext.md
          files: ${{ steps.apk.outputs.name }}
          fail_on_unmatched_files: true
          make_latest: true
