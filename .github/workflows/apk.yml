name: Android-App bauen

# Eine Veroeffentlichung entsteht nur aus einer Versionsmarke. Ablauf:
#
#   1. Fassung in package.json, index.html und CHANGELOG.md eintragen
#   2. git tag v1.2.3 && git push origin v1.2.3
#
# Den Rest macht dieser Bauplan: er prueft, dass die drei Stellen dieselbe
# Nummer nennen, baut die APK mit genau dieser Nummer und legt eine eigene
# Veroeffentlichung v1.2.3 an. Die bleibt danach unveraendert - jede neue
# Fassung bekommt eine eigene.
#
# "Run workflow" im Reiter Actions baut zum Ausprobieren, ohne zu
# veroeffentlichen.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - name: Quelltext holen
        uses: actions/checkout@v4

      - name: Fassung bestimmen und Stellen vergleichen
        # Drei Stellen nennen die Fassung. Weichen sie voneinander ab,
        # bricht der Bau ab - lieber hier als in der Hand des Benutzers.
        id: fassung
        run: |
          set -eu
          PAKET="$(node -p "require('./package.json').version")"

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            MARKE="${GITHUB_REF_NAME#v}"
            FEHLER=0
            if [ "$MARKE" != "$PAKET" ]; then
              echo "::error::Marke $GITHUB_REF_NAME passt nicht zu package.json ($PAKET)."
              FEHLER=1
            fi
            if ! grep -q "Fassung $PAKET" index.html; then
              echo "::error::index.html nennt im Fuss nicht die Fassung $PAKET."
              FEHLER=1
            fi
            if ! grep -q "^## \[$PAKET\]" CHANGELOG.md; then
              echo "::error::CHANGELOG.md hat keinen Abschnitt [$PAKET]."
              FEHLER=1
            fi
            [ "$FEHLER" -eq 0 ] || exit 1
          fi

          # Android zaehlt Fassungen als ganze Zahl, die nie kleiner werden
          # darf. 1.2.3 wird zu 10203.
          MA="$(echo "$PAKET" | cut -d. -f1)"
          MI="$(echo "$PAKET" | cut -d. -f2)"
          PA="$(echo "$PAKET" | cut -d. -f3)"
          echo "nummer=$PAKET"                        >> "$GITHUB_OUTPUT"
          echo "code=$((MA * 10000 + MI * 100 + PA))" >> "$GITHUB_OUTPUT"
          echo "Fassung $PAKET, Android-Zaehler $((MA * 10000 + MI * 100 + PA))"

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Webdateien einsammeln
        # Capacitor erwartet die Seite in einem eigenen Ordner. Der Server und
        # die Windows-Skripte gehoeren nicht in die App.
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest www/
          cp icon-32.png icon-180.png icon-192.png icon-512.png www/
          ls -la www

      - name: Symbol fuer die App vorbereiten
        # icon-only ist das klassische quadratische Symbol - da passt das Logo
        # unveraendert. Fuer Androids adaptive Symbole liegt das Logo dagegen
        # verkleinert auf durchsichtigem Grund (app-icon-foreground), weil die
        # Maske aussen rund ein Viertel abschneidet.
        run: |
          mkdir -p assets
          cp icon-512.png assets/icon-only.png
          cp app-icon-foreground.png assets/icon-foreground.png
          cp app-icon-background.png assets/icon-background.png

      - name: Abhaengigkeiten installieren
        run: npm install

      - name: Android-Projekt erzeugen
        run: npx cap add android

      - name: Fassung ins Android-Projekt schreiben
        run: |
          set -eu
          sed -i 's/versionCode .*/versionCode ${{ steps.fassung.outputs.code }}/' android/app/build.gradle
          sed -i 's/versionName .*/versionName "${{ steps.fassung.outputs.nummer }}"/' android/app/build.gradle
          grep -n 'version\(Code\|Name\)' android/app/build.gradle

      - name: Symbole erzeugen
        # Schlaegt das fehl, baut die App trotzdem - nur mit Standardsymbol.
        continue-on-error: true
        run: npx capacitor-assets generate --android

      - name: Webdateien ins Projekt kopieren
        run: npx cap sync android

      - name: APK bauen
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK benennen
        id: apk
        run: |
          set -eu
          NAME="spieleabend-${{ steps.fassung.outputs.nummer }}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          ls -la "$NAME"

      - name: APK als Arbeitsergebnis anhaengen
        uses: actions/upload-artifact@v4
        with:
          name: spieleabend-apk
          path: ${{ steps.apk.outputs.name }}

      - name: Begleittext aus der Aenderungshistorie holen
        if: github.ref_type == 'tag'
        run: |
          set -eu
          {
            echo "**Installieren:** Datei \`${{ steps.apk.outputs.name }}\` auf dem"
            echo "Handy oeffnen. Android fragt beim ersten Mal, ob Apps aus dieser"
            echo "Quelle erlaubt sind - das muss einmalig bestaetigt werden. Eine"
            echo "bereits vorhandene Fassung wird ersetzt, die Sammlung bleibt."
            echo
            echo "---"
            echo
            awk -v v="${{ steps.fassung.outputs.nummer }}" '
              $0 ~ "^## \\[" v "\\]" { an = 1; next }
              an && /^## \[/          { exit }
              an && /^\[[^]]+\]: /    { exit }
              an                      { print }
            ' CHANGELOG.md
          } > begleittext.md
          cat begleittext.md

      - name: Veroeffentlichen
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: Spieleabend ${{ github.ref_name }}
          body_path: begleittext.md
          files: ${{ steps.apk.outputs.name }}
          fail_on_unmatched_files: true
          make_latest: true
