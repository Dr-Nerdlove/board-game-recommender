name: APK bauen

# Baut die Android-App aus index.html. Laeuft auf GitHubs Maschinen, weil dort
# das Android-SDK schon installiert ist. Von Hand startbar (Reiter "Actions" ->
# "APK bauen" -> "Run workflow"); das Ergebnis haengt als Datei an der
# Veroeffentlichung "apk" und bleibt dort dauerhaft herunterladbar.

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'icon-*.png'
      - 'app-icon-*.png'
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/workflows/apk.yml'

permissions:
  contents: write

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - name: Quelltext holen
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Webdateien einsammeln
        # Capacitor erwartet die Seite in einem eigenen Ordner. Der Server und
        # die Windows-Skripte gehoeren nicht in die App.
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest www/
          cp icon-32.png icon-180.png icon-192.png icon-512.png www/
          ls -la www

      - name: Symbol fuer die App vorbereiten
        # icon-only ist das klassische quadratische Symbol - da passt das Logo
        # unveraendert. Fuer Androids adaptive Symbole liegt das Logo dagegen
        # verkleinert auf durchsichtigem Grund (app-icon-foreground), weil die
        # Maske aussen rund ein Viertel abschneidet.
        run: |
          mkdir -p assets
          cp icon-512.png assets/icon-only.png
          cp app-icon-foreground.png assets/icon-foreground.png
          cp app-icon-background.png assets/icon-background.png

      - name: Abhaengigkeiten installieren
        run: npm install

      - name: Android-Projekt erzeugen
        run: npx cap add android

      - name: Symbole erzeugen
        # Schlaegt das fehl, baut die App trotzdem - nur mit Standardsymbol.
        continue-on-error: true
        run: npx capacitor-assets generate --android

      - name: Webdateien ins Projekt kopieren
        run: npx cap sync android

      - name: APK bauen
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK umbenennen
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk spieleabend.apk
          ls -la spieleabend.apk

      - name: APK als Arbeitsergebnis anhaengen
        uses: actions/upload-artifact@v4
        with:
          name: spieleabend-apk
          path: spieleabend.apk

      - name: Stand festhalten
        # Die Veroeffentlichung behaelt immer dieselbe Marke "apk", damit der
        # Link dauerhaft gleich bleibt. Dadurch bliebe aber auch das Datum auf
        # dem ersten Bau stehen - von aussen waere nicht zu erkennen, ob die
        # Datei frisch ist. Deshalb Datum und Commit in Titel und Text.
        id: stand
        run: |
          echo "datum=$(date -u '+%d.%m.%Y, %H:%M Uhr UTC')" >> "$GITHUB_OUTPUT"
          echo "kurz=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Marke apk auf diesen Stand schieben
        # Sonst zeigt die Veroeffentlichung weiter auf den Commit des
        # allerersten Baus.
        run: |
          git tag -f apk
          git push -f origin refs/tags/apk

      - name: APK veroeffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: Spieleabend als Android-App - Stand ${{ steps.stand.outputs.datum }}
          body: |
            Die aktuelle App zum Herunterladen und Installieren.

            **Installieren:** Datei `spieleabend.apk` auf dem Handy oeffnen.
            Android fragt beim ersten Mal, ob Apps aus dieser Quelle erlaubt
            sind - das muss einmalig bestaetigt werden.

            Gebaut am ${{ steps.stand.outputs.datum }}
            aus Commit `${{ steps.stand.outputs.kurz }}`.

            Die Adresse dieser Seite bleibt immer dieselbe - die Datei
            darunter wird bei jedem Bau ersetzt. Stimmt das Datum oben mit
            dem letzten Commit ueberein, ist die Datei aktuell.
          files: spieleabend.apk
          fail_on_unmatched_files: true
