name: Android-App bauen

# Eine Veroeffentlichung entsteht aus einer Fassungsnummer, nie aus einem
# beliebigen Stand. Zwei Wege fuehren dorthin:
#
#   A) Im Browser: Reiter "Actions" -> "Android-App bauen" -> "Run workflow",
#      Haken bei "veroeffentlichen". Die Marke wird dabei angelegt.
#   B) Auf der Kommandozeile: git tag v1.2.3 && git push origin v1.2.3
#
# Beide Male prueft der Bauplan zuerst, ob package.json, der Fuss von
# index.html und CHANGELOG.md dieselbe Nummer nennen, baut dann die APK mit
# genau dieser Nummer und legt die Veroeffentlichung v1.2.3 an. Die bleibt
# danach unveraendert - jede neue Fassung bekommt eine eigene.
#
# "Run workflow" ohne den Haken baut nur zum Ausprobieren.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      veroeffentlichen:
        description: 'Veroeffentlichen (Marke anlegen und Release erstellen)'
        type: boolean
        default: false

permissions:
  contents: write

env:
  # Der Fingerabdruck des Signaturschluessels. Kein Geheimnis - er steht in
  # jeder veroeffentlichten APK und ist genau dafuer da, oeffentlich geprueft
  # zu werden. Weicht ein Bau davon ab, wurde mit einem anderen Schluessel
  # signiert und die App liesse sich nicht mehr aktualisieren: Dann bricht der
  # Bau ab, bevor etwas veroeffentlicht wird.
  ERWARTETE_SIGNATUR: "82:B8:A1:99:A0:D6:A3:0B:B8:2E:9B:87:E0:A2:C8:75:31:F6:66:0F:9B:8F:67:3C:D1:4C:C9:80:ED:97:9C:A9"

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - name: Quelltext holen
        uses: actions/checkout@v4

      - name: Fassung bestimmen und Stellen vergleichen
        # Drei Stellen nennen die Fassung. Weichen sie voneinander ab,
        # bricht der Bau ab - lieber hier als in der Hand des Benutzers.
        id: fassung
        run: |
          set -eu
          PAKET="$(node -p "require('./package.json').version")"
          RAUS=nein

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            RAUS=ja
            if [ "${GITHUB_REF_NAME#v}" != "$PAKET" ]; then
              echo "::error::Marke $GITHUB_REF_NAME passt nicht zu package.json ($PAKET)."
              exit 1
            fi
          elif [ "${{ inputs.veroeffentlichen }}" = "true" ]; then
            RAUS=ja
            if git ls-remote --exit-code --tags origin "refs/tags/v$PAKET" >/dev/null 2>&1; then
              echo "::error::Die Marke v$PAKET gibt es schon. Erst die Fassung erhoehen."
              exit 1
            fi
          fi

          if [ "$RAUS" = "ja" ]; then
            FEHLER=0
            if ! grep -q "Fassung $PAKET" index.html; then
              echo "::error::index.html nennt im Fuss nicht die Fassung $PAKET."
              FEHLER=1
            fi
            if ! grep -q "^## \[$PAKET\]" CHANGELOG.md; then
              echo "::error::CHANGELOG.md hat keinen Abschnitt [$PAKET]."
              FEHLER=1
            fi
            [ "$FEHLER" -eq 0 ] || exit 1
          fi
          echo "raus=$RAUS" >> "$GITHUB_OUTPUT"

          # Android zaehlt Fassungen als ganze Zahl, die nie kleiner werden
          # darf. 1.2.3 wird zu 10203.
          MA="$(echo "$PAKET" | cut -d. -f1)"
          MI="$(echo "$PAKET" | cut -d. -f2)"
          PA="$(echo "$PAKET" | cut -d. -f3)"
          echo "nummer=$PAKET"                        >> "$GITHUB_OUTPUT"
          echo "code=$((MA * 10000 + MI * 100 + PA))" >> "$GITHUB_OUTPUT"
          echo "Fassung $PAKET, Android-Zaehler $((MA * 10000 + MI * 100 + PA))"

      - name: Signaturschluessel bereitlegen
        # Ohne festen Schluessel signiert Gradle jeden Bau mit einem neuen
        # Zufallsschluessel. Fuer Android ist die Signatur der Ausweis der App:
        # Zwei Pakete mit verschiedenen Ausweisen sind zwei verschiedene Apps,
        # und eine Aktualisierung scheitert mit "App nicht installiert".
        env:
          SCHLUESSEL: ${{ secrets.SIGNIER_SCHLUESSEL }}
          PASSWORT: ${{ secrets.SIGNIER_PASSWORT }}
        run: |
          set -eu
          if [ -z "${SCHLUESSEL:-}" ] || [ -z "${PASSWORT:-}" ]; then
            echo "::error::Die Geheimnisse SIGNIER_SCHLUESSEL und SIGNIER_PASSWORT fehlen."
            echo "::error::Anzulegen unter Settings -> Secrets and variables -> Actions."
            echo "::error::Naeheres in ENTWICKLUNG.md, Abschnitt \"Signatur\"."
            exit 1
          fi
          printf '%s' "$SCHLUESSEL" | base64 -d > "$RUNNER_TEMP/spieleabend.keystore"
          test -s "$RUNNER_TEMP/spieleabend.keystore"
          echo "Schluessel bereit ($(wc -c < "$RUNNER_TEMP/spieleabend.keystore") Bytes)."

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Webdateien einsammeln
        # Capacitor erwartet die Seite in einem eigenen Ordner. Der Server und
        # die Windows-Skripte gehoeren nicht in die App.
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest www/
          cp icon-32.png icon-180.png icon-192.png icon-512.png www/
          ls -la www

      - name: Symbol fuer die App vorbereiten
        # icon-only ist das Symbol fuer Oberflaechen ohne adaptive Darstellung:
        # die fertige runde Scheibe. Fuer adaptive Symbole liefern wir zwei
        # Ebenen - app-icon-background traegt die Zweiteilung, app-icon-foreground
        # das Motiv.
        run: |
          mkdir -p assets
          cp icon-512.png assets/icon-only.png
          cp app-icon-foreground.png assets/icon-foreground.png
          cp app-icon-background.png assets/icon-background.png

      - name: Abhaengigkeiten installieren
        run: npm install

      - name: Android-Projekt erzeugen
        run: npx cap add android

      - name: Fassung ins Android-Projekt schreiben
        run: |
          set -eu
          sed -i 's/versionCode .*/versionCode ${{ steps.fassung.outputs.code }}/' android/app/build.gradle
          sed -i 's/versionName .*/versionName "${{ steps.fassung.outputs.nummer }}"/' android/app/build.gradle
          grep -n 'version\(Code\|Name\)' android/app/build.gradle

      - name: Signatur ins Android-Projekt eintragen
        # Ein zweiter android-Block ergaenzt den aus der Vorlage; das ist
        # stabiler als in den vorhandenen hineinzuschneiden.
        run: |
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  freigabe {
                      storeFile file(System.getenv("SPIELEABEND_KEYSTORE"))
                      storePassword System.getenv("SPIELEABEND_PASSWORT")
                      keyAlias "spieleabend"
                      keyPassword System.getenv("SPIELEABEND_PASSWORT")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.freigabe
                  }
              }
          }
          GRADLE
          tail -18 android/app/build.gradle

      - name: Symbole erzeugen
        # Schlaegt das fehl, baut die App trotzdem - nur mit Standardsymbol.
        continue-on-error: true
        run: npx capacitor-assets generate --android

      - name: Webdateien ins Projekt kopieren
        run: npx cap sync android

      - name: APK bauen
        env:
          SPIELEABEND_KEYSTORE: ${{ runner.temp }}/spieleabend.keystore
          SPIELEABEND_PASSWORT: ${{ secrets.SIGNIER_PASSWORT }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: APK benennen und Signatur pruefen
        id: apk
        # pipefail ist hier wesentlich: Ohne das zaehlt nur der Ausgang des
        # letzten Glieds einer Rohrleitung. Ein gescheitertes keytool blieb so
        # unbemerkt, weil das nachfolgende sed mit leerer Eingabe zufrieden war.
        run: |
          set -euo pipefail
          NAME="spieleabend-${{ steps.fassung.outputs.nummer }}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          ls -la "$NAME"

          # apksigner statt keytool: Letzteres liest nur die alte JAR-Signatur
          # (v1), die ab minSdk 24 gar nicht mehr erzeugt wird.
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          APKSIGNER="$(ls -d "$SDK"/build-tools/*/apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"

          "$APKSIGNER" verify --verbose "$NAME"
          ROH="$("$APKSIGNER" verify --print-certs "$NAME" | grep -m1 'SHA-256 digest' | sed 's/.*digest: *//')"
          test -n "$ROH"
          ABDRUCK="$(printf '%s' "$ROH" | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')"
          echo "Fingerabdruck der Signatur: $ABDRUCK"

          if [ "$ABDRUCK" != "$ERWARTETE_SIGNATUR" ]; then
            echo "::error::Mit einem anderen Schluessel signiert als erwartet."
            echo "::error::erwartet: $ERWARTETE_SIGNATUR"
            echo "::error::erhalten: $ABDRUCK"
            echo "::error::So signiert liesse sich die App nicht aktualisieren."
            exit 1
          fi
          echo "abdruck=$ABDRUCK" >> "$GITHUB_OUTPUT"

      - name: APK als Arbeitsergebnis anhaengen
        # Nur bei Probelaeufen. Bei einer Veroeffentlichung haengt dieselbe
        # Datei ohnehin am Release und bleibt dort dauerhaft - der Anhang waere
        # eine zweite Kopie, die dieses Projekt nach sieben Tagen wegraeumt
        # (am Anhang eines Probelaufs nachgesehen: angelegt am 21.10., laeuft
        # ab am 28.10.). Bei einem Probelauf ist er der einzige Weg an die
        # gebaute Datei, dort bleibt er.
        if: steps.fassung.outputs.raus != 'ja'
        uses: actions/upload-artifact@v4
        with:
          name: spieleabend-apk
          path: ${{ steps.apk.outputs.name }}

      - name: Begleittext aus der Aenderungshistorie holen
        if: steps.fassung.outputs.raus == 'ja'
        run: |
          set -eu
          {
            echo "**Installieren:** Datei \`${{ steps.apk.outputs.name }}\` auf dem"
            echo "Handy oeffnen. Android fragt beim ersten Mal, ob Apps aus dieser"
            echo "Quelle erlaubt sind - das muss einmalig bestaetigt werden. Eine"
            echo "bereits vorhandene Fassung wird ersetzt, die Sammlung bleibt."
            echo
            echo "Signatur: \`${{ steps.apk.outputs.abdruck }}\`"
            echo
            echo "---"
            echo
            awk -v v="${{ steps.fassung.outputs.nummer }}" '
              $0 ~ "^## \\[" v "\\]" { an = 1; next }
              an && /^## \[/          { exit }
              an && /^\[[^]]+\]: /    { exit }
              an                      { print }
            ' CHANGELOG.md
          } > begleittext.md
          cat begleittext.md

      - name: Veroeffentlichen
        # Gibt es die Marke noch nicht, legt GitHub sie beim Anlegen der
        # Veroeffentlichung auf diesem Stand an.
        if: steps.fassung.outputs.raus == 'ja'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.fassung.outputs.nummer }}
          target_commitish: ${{ github.sha }}
          name: Spieleabend v${{ steps.fassung.outputs.nummer }}
          body_path: begleittext.md
          files: ${{ steps.apk.outputs.name }}
          fail_on_unmatched_files: true
          make_latest: true
